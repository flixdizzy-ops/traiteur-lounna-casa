{% extends 'admin/base.html' %}
{% block content %}
<div class="admin-card"><div class="eyebrow">Navigation</div><h3>Ajouter un lien</h3><form method="post" class="form-grid"><div class="form-grid two-col"><label>Libellé<input name="label" required /></label><label>URL interne ou externe<input name="url" required placeholder="/page/notre-histoire" /></label></div><label>Type<select name="target_type"><option value="internal">Page interne</option><option value="external">Lien externe</option></select></label><div class="form-grid two-col"><label><input type="checkbox" name="visible_nav" checked /> Navigation principale</label><label><input type="checkbox" name="visible_footer" /> Footer</label></div><label>Ordre<input type="number" name="sort_order" value="0" /></label><button class="button accent" type="submit">Ajouter le lien</button></form></div>
<div class="admin-card"><h3>Liens actifs</h3><div class="table-wrap"><table><thead><tr><th>Libellé</th><th>URL</th><th>Navigation</th><th>Footer</th><th></th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.label }}</td><td>{{ item.url }}</td><td>{{ 'Oui' if item.visible_nav else 'Non' }}</td><td>{{ 'Oui' if item.visible_footer else 'Non' }}</td><td class="table-actions"><a class="button small light" href="{{ url_for('admin_navigation_edit', item_id=item.id) }}">Modifier</a><form method="post" action="{{ url_for('admin_navigation_delete', item_id=item.id) }}"><button class="button small dark" type="submit">Supprimer</button></form></td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
