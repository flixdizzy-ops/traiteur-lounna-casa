{% extends 'admin/base.html' %}
{% block content %}
<div class="admin-card">
  <div class="eyebrow">Catalogue</div><h3>Catégories</h3>
  <form method="post" class="form-grid">
    <div class="form-grid two-col"><label>Slug<input name="slug" placeholder="desserts" required /></label><label>Nom FR<input name="name_fr" required /></label></div>
    <div class="form-grid two-col"><label>Nom AR<input name="name_ar" /></label><label>Nom EN<input name="name_en" /></label></div>
    <button class="button accent" type="submit">Enregistrer la catégorie</button>
  </form>
  <div class="table-wrap"><table><thead><tr><th>Slug</th><th>Nom FR</th><th>Nom AR</th><th>Nom EN</th><th>Action</th></tr></thead><tbody>{% for category in categories %}{% set names = category.name|from_json %}<tr><td>{{ category.slug }}</td><td>{{ names.get('fr') }}</td><td>{{ names.get('ar') }}</td><td>{{ names.get('en') }}</td><td><form method="post" action="{{ url_for('admin_category_delete', category_id=category.id) }}"><button class="button small dark" type="submit">Supprimer</button></form></td></tr>{% endfor %}</tbody></table></div>
</div>
{% endblock %}
