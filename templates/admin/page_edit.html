{% extends 'admin/base.html' %}{% block content %}{% set titles = page.title|from_json %}{% set bodies = page.content|from_json %}<div class="admin-card"><div class="eyebrow">Pages Manager</div><h3>Modifier la page</h3><form method="post" enctype="multipart/form-data" class="form-grid"><div class="form-grid two-col"><label>Nom<input name="name" value="{{ page.name }}" required /></label><label>Slug<input name="slug" value="{{ page.slug }}" required /></label></div><div class="form-grid two-col"><label>Titre FR<input name="title_fr" value="{{ titles.get('fr', '') }}" required /></label><label>Titre AR<input name="title_ar" value="{{ titles.get('ar', '') }}" /></label></div><label>Titre EN<input name="title_en" value="{{ titles.get('en', '') }}" /></label><div class="form-grid two-col"><label>Contenu FR<textarea name="content_fr">{{ bodies.get('fr', '') }}</textarea></label><label>Contenu AR<textarea name="content_ar">{{ bodies.get('ar', '') }}</textarea></label></div><label>Contenu EN<textarea name="content_en">{{ bodies.get('en', '') }}</textarea></label><div class="form-grid two-col"><label>SEO title<input name="seo_title" value="{{ page.seo_title or '' }}" /></label><label>Canonical URL<input name="canonical_url" type="url" value="{{ page.canonical_url or '' }}" /></label></div><label>Meta description<textarea name="seo_description">{{ page.seo_description or '' }}</textarea></label><label>Nouvelle image<input type="file" name="image_file" accept="image/jpeg,image/png,image/webp" /></label><label><input type="checkbox" name="active" {% if page.active %}checked{% endif %} /> Active</label><label><input type="checkbox" name="nav_visible" {% if page.nav_visible %}checked{% endif %} /> Navigation</label><label><input type="checkbox" name="footer_visible" {% if page.footer_visible %}checked{% endif %} /> Footer</label><label>Ordre<input type="number" name="sort_order" value="{{ page.sort_order }}" /></label><button class="button accent" type="submit">Enregistrer</button></form></div>{% endblock %}
