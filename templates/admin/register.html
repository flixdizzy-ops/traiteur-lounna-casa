<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>Créer un compte | CMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='js/security.js') }}" defer></script>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="brand" style="margin-bottom: 20px;">
          {% if settings.get('logo') %}<img class="brand-logo" src="{{ settings.get('logo') }}" alt="{{ settings.get('company_name', 'TRAITEUR LOUNNA CASA') }}" />{% else %}<span class="brand-mark">TL</span>{% endif %}
          <span class="brand-text"><strong>TRAITEUR</strong><small>LOUNNA CASA</small></span>
        </div>
        <h2>Créer un compte administrateur</h2>
        {% if error %}<p style="color:#b00020;">{{ error }}</p>{% endif %}
        <form method="post" class="form-grid" style="margin-top: 20px;">
          <label>Identifiant<input type="text" name="username" minlength="3" required /></label>
          <label>Mot de passe<input type="password" name="password" minlength="8" required /></label>
          <label>Confirmer le mot de passe<input type="password" name="password_confirmation" minlength="8" required /></label>
          <button type="submit" class="button accent" style="width:100%;">Créer le compte</button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('admin_login') }}">Retour à la connexion</a></p>
      </div>
    </div>
  </body>
</html>
