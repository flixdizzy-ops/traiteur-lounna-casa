{% extends 'admin/base.html' %}
{% block content %}
<div class="admin-card">
  <div class="eyebrow">Produit</div>
  <h3>{{ 'Modifier le produit' if product else 'Ajouter un produit' }}</h3>
  <form method="post" class="form-grid" enctype="multipart/form-data">
    <div class="form-grid two-col">
      <label>Nom FR
        <input type="text" name="name_fr" value="{{ product.name.get('fr', '') if product else '' }}" required />
      </label>
      <label>Nom AR
        <input type="text" name="name_ar" value="{{ product.name.get('ar', '') if product else '' }}" />
      </label>
    </div>
    <div class="form-grid two-col">
      <label>Nom EN
        <input type="text" name="name_en" value="{{ product.name.get('en', '') if product else '' }}" />
      </label>
      <label>Catégorie
        <select name="category">
          {% for category in categories %}{% set category_names = category.name|from_json %}<option value="{{ category.slug }}" {% if product and product.category == category.slug %}selected{% endif %}>{{ category_names.get('fr', category.slug) }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <div class="form-grid two-col">
      <label>Prix (MAD)
        <input type="number" step="0.01" name="price" value="{{ product.price if product else 0 }}" required />
      </label>
      <label>Image depuis votre appareil
        <input type="file" name="image_file" accept="image/jpeg,image/png,image/webp" data-image-preview />
        <small>JPG, PNG ou WEBP. L’image actuelle est conservée si aucun fichier n’est choisi.</small>
        <img class="upload-preview" data-preview-target src="{{ product.image if product else 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=80' }}" alt="Aperçu de l’image" />
        {% if product and product.image.startswith('/uploads/') %}<label><input type="checkbox" name="remove_image" /> Supprimer l’image actuelle</label>{% endif %}
      </label>
    </div>
    <div class="form-grid two-col">
      <label>Description FR
        <textarea name="description_fr" required>{{ product.description.get('fr', '') if product else '' }}</textarea>
      </label>
      <label>Description AR
        <textarea name="description_ar">{{ product.description.get('ar', '') if product else '' }}</textarea>
      </label>
    </div>
    <label>Description EN
      <textarea name="description_en">{{ product.description.get('en', '') if product else '' }}</textarea>
    </label>
    <div class="form-grid two-col">
      <label><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %} /> Featured</label>
      <label><input type="checkbox" name="popular" {% if product and product.popular %}checked{% endif %} /> Popular</label>
    </div>
    <button type="submit" class="button accent">Enregistrer</button>
  </form>
</div>
<script>
  document.querySelector('[data-image-preview]')?.addEventListener('change', function () {
    const file = this.files?.[0];
    const preview = document.querySelector('[data-preview-target]');
    if (file && preview) preview.src = URL.createObjectURL(file);
  });
</script>
{% endblock %}
