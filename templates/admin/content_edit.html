{% extends 'admin/base.html' %}{% block content %}{% set titles = item.title|from_json %}{% set bodies = item.body|from_json %}<div class="admin-card"><div class="eyebrow">Contenu</div><h3>Modifier {{ item.content_type }}</h3><form method="post" enctype="multipart/form-data" class="form-grid"><div class="form-grid two-col"><label>Titre FR<input name="title_fr" value="{{ item.title_fr or titles.get('fr', item.title) }}" required /></label><label>Titre AR<input name="title_ar" value="{{ item.title_ar or titles.get('ar', '') }}" /></label></div><label>Titre EN<input name="title_en" value="{{ item.title_en or titles.get('en', '') }}" /></label><div class="form-grid two-col"><label>Contenu FR<textarea name="body_fr">{{ item.body_fr or bodies.get('fr', item.body or '') }}</textarea></label><label>Contenu AR<textarea name="body_ar">{{ item.body_ar or bodies.get('ar', '') }}</textarea></label></div><label>Contenu EN<textarea name="body_en">{{ item.body_en or bodies.get('en', '') }}</textarea></label><div class="form-grid two-col"><label>Icône<input name="icon" value="{{ item.icon or '' }}" /></label><label>Image<input type="file" name="image_file" accept="image/jpeg,image/png,image/webp" /></label></div><label>Ordre<input type="number" name="sort_order" value="{{ item.sort_order }}" /></label><label><input type="checkbox" name="active" {% if item.active %}checked{% endif %} /> Actif</label><button class="button accent" type="submit">Enregistrer</button></form></div>{% endblock %}
