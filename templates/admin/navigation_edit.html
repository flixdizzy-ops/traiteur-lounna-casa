{% extends 'admin/base.html' %}{% block content %}<div class="admin-card"><div class="eyebrow">Navigation</div><h3>Modifier le lien</h3><form method="post" class="form-grid"><div class="form-grid two-col"><label>Libellé<input name="label" value="{{ item.label }}" required /></label><label>URL<input name="url" value="{{ item.url }}" required /></label></div><label>Type<select name="target_type"><option value="internal" {% if item.target_type == 'internal' %}selected{% endif %}>Page interne</option><option value="external" {% if item.target_type == 'external' %}selected{% endif %}>Lien externe</option></select></label><div class="form-grid two-col"><label><input type="checkbox" name="visible_nav" {% if item.visible_nav %}checked{% endif %} /> Navigation principale</label><label><input type="checkbox" name="visible_footer" {% if item.visible_footer %}checked{% endif %} /> Footer</label></div><label>Ordre<input type="number" name="sort_order" value="{{ item.sort_order }}" /></label><button class="button accent" type="submit">Enregistrer</button></form></div>{% endblock %}
