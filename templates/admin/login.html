<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="brand" style="margin-bottom: 20px;">
          {% if settings.get('logo') %}<img class="brand-logo" src="{{ settings.get('logo') }}" alt="{{ settings.get('company_name', 'TRAITEUR LOUNNA CASA') }}" />{% else %}<span class="brand-mark">TL</span>{% endif %}
          <span class="brand-text">
            <strong>TRAITEUR</strong>
            <small>LOUNNA CASA</small>
          </span>
        </div>
        <h2>Connexion admin</h2>
        {% if error %}<p style="color:#b00020;">{{ error }}</p>{% endif %}
        <form method="post" class="form-grid" style="margin-top: 20px;">
          <label>Identifiant
            <input type="text" name="username" required />
          </label>
          <label>Mot de passe
            <input type="password" name="password" required />
          </label>
          <button type="submit" class="button accent" style="width:100%;">Se connecter</button>
        </form>
        <p class="auth-switch">Nouveau dans le CMS ? <a href="{{ url_for('admin_register') }}">Créer un compte / Register</a></p>
      </div>
    </div>
  </body>
</html>
